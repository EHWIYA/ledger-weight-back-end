# 연결 전환 단계: 실제 빌드/배포/재시작은 별도 승인 전까지 실행하지 않는다.
name: Ledger OIDC connection only

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ledger-oidc-connect
  cancel-in-progress: false

jobs:
  oidc-connect:
    name: OIDC and NAS transport verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify identity and reject wrong audience
        env:
          TS_OIDC_CLIENT_ID: ${{ vars.TS_OIDC_CLIENT_ID }}
          TS_OIDC_AUDIENCE: ${{ vars.TS_OIDC_AUDIENCE }}
        run: python3 .github/scripts/check-ci-oidc.py identity

      - name: Connect ephemeral CI node
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4
        with:
          oauth-client-id: ${{ vars.TS_OIDC_CLIENT_ID }}
          audience: ${{ vars.TS_OIDC_AUDIENCE }}
          tags: tag:ledger-ci
          timeout: "30s"
          retry: "1"

      - name: Verify NAS host key and network isolation
        env:
          NAS_SSH_HOST_KEYS: ${{ vars.NAS_SSH_HOST_KEYS }}
        run: python3 .github/scripts/check-ci-oidc.py transport
